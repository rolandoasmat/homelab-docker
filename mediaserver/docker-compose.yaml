services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.1
    container_name: sabnzbd
    restart: unless-stopped
    volumes:
      - /docker-data/sabnzbd:/config
      - nfs-media:/media
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.lucumatv.com`)"
      - "traefik.http.routers.sabnzbd.entrypoints=https"
      - "traefik.http.routers.sabnzbd.tls=true"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"
    networks:
      - traefik

  plex:
    image: lscr.io/linuxserver/plex:1.43.3
    container_name: plex
    restart: unless-stopped
# Add Configurations for GPU Hardware Rendering Here:
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /docker-data/plex:/config
      - nfs-media:/media
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
      - VERSION=latest
    ports:
      - "32400:32400"
    networks:
      - traefik

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    restart: unless-stopped
    volumes:
      - /docker-data/radarr:/config
      - nfs-media:/media
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.lucumatv.com`)"
      - "traefik.http.routers.radarr.entrypoints=https"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    networks:
      - traefik

  radarr-4k:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr-4k
    restart: unless-stopped
    volumes:
      - /docker-data/radarr-4k:/config
      - nfs-media:/media
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr-4k.rule=Host(`radarr-4k.lucumatv.com`)"
      - "traefik.http.routers.radarr-4k.entrypoints=https"
      - "traefik.http.routers.radarr-4k.tls=true"
      - "traefik.http.services.radarr-4k.loadbalancer.server.port=7878"
    networks:
      - traefik

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    restart: unless-stopped
    volumes:
      - /docker-data/sonarr:/config
      - nfs-media:/media
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.lucumatv.com`)"
      - "traefik.http.routers.sonarr.entrypoints=https"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    networks:
      - traefik

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    restart: unless-stopped
    volumes:
      - /docker-data/prowlarr:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.lucumatv.com`)"
      - "traefik.http.routers.prowlarr.entrypoints=https"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    networks:
      - traefik

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    init: true
    container_name: seerr
    restart: unless-stopped
    volumes:
      - /docker-data/seerr:/app/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - LOG_LEVEL=debug
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`requests.lucumatv.com`)"
      - "traefik.http.routers.seerr.entrypoints=https"
      - "traefik.http.routers.seerr.tls=true"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
    networks:
      - traefik

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.1
    container_name: recyclarr
    restart: unless-stopped
    volumes:
      - /docker-data/recyclarr:/config
      # Config is managed in git; deploy.sh injects secrets into this file
      - type: bind
        source: ./recyclarr/recyclarr.yml
        target: /config/recyclarr.yml
      - /etc/localtime:/etc/localtime:ro
    networks:
      - traefik

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    restart: unless-stopped
    volumes:
      - /docker-data/bazarr:/config
      - nfs-media:/media
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PUID=1000
      - PGID=1000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.lucumatv.com`)"
      - "traefik.http.routers.bazarr.entrypoints=https"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    networks:
      - traefik

  tautulli:
    image: lscr.io/linuxserver/tautulli:2.17.2
    container_name: tautulli
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - /docker-data/tautulli:/config
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.lucumatv.com`)"
      - "traefik.http.routers.tautulli.entrypoints=https"
      - "traefik.http.routers.tautulli.tls=true"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"
    networks:
      - traefik

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:3.24.0
    container_name: maintainerr
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - /docker-data/maintainerr:/opt/data
      - /etc/localtime:/etc/localtime:ro
#    environment:
#      - BASE_PATH=/maintainerr # uncomment if you're serving maintainerr from a subdirectory
#      - UI_HOSTNAME=:: # uncomment if you want to listen on IPv6 instead (default 0.0.0.0)
#      - UI_PORT=6247 # uncomment to change the UI port (default 6246). Useful if you're on a network where the port is already in use
#      - API_PORT=3002 # uncomment to change the API port (default 3001). Useful if you're on a network where the port is already in use
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maintainerr.rule=Host(`maintainerr.lucumatv.com`)"
      - "traefik.http.routers.maintainerr.entrypoints=https"
      - "traefik.http.routers.maintainerr.tls=true"
      - "traefik.http.services.maintainerr.loadbalancer.server.port=6246"
    networks:
      - traefik

volumes:
  nfs-media:
    driver_opts:
      type: "nfs"
      o: "addr=truenas.lucumatv.com,nolock,soft,nfsvers=4"
      device: ":/mnt/hdd-pool/media"

networks:
  traefik:
    external: true
